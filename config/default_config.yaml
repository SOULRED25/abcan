# abCAN-v2 Refined Configuration
# Dual-Stream SE(3)-Equivariant Architecture

# ─────────────────────────────────────────────
# Project
# ─────────────────────────────────────────────
project:
  name: "abCAN-v2-SE3"
  description: "Dual-Stream SE(3)-Equivariant Architecture for Antibody-Antigen ΔΔG"
  seed: 42
  device: "auto"

# ─────────────────────────────────────────────
# 1. Active data
# ─────────────────────────────────────────────
dataset:
  # Base directory where the user will place all databases.
  database_dir: "database/"

  # The only active training source. SAbDab2 and AbAgym stay in database/
  # for future work but are never read by scripts/train.py.
  active_benchmark: "abcan_source_only"
  abcan_sources:
    candidate_manifest: "database/abcan/source_candidates_unfiltered.csv"
    include_sources: ["AB-Bind", "SKEMPI 1", "SKEMPI 2"]
    validation_fraction: 0.15
    test_fraction: 0.15

# ─────────────────────────────────────────────
# 2. Dual-Stream Feature Encoders
# ─────────────────────────────────────────────
encoders:
  # Structure Stream: SE(3)-Equivariant GNN
  se3_egnn:
    node_dim: 128
    edge_dim: 32
    num_layers: 4
    aggr: "mean"
    
  # Sequence Stream: ESM2
  esm2:
    model_name: "esm2_t33_650M_UR50D"
    embedding_dim: 1280
    freeze: true
    
  # Zero-Shot LLR Prior
  zero_shot_llr:
    enabled: true

# ─────────────────────────────────────────────
# 3. Bi-Directional Cross-Attention Engine
# ─────────────────────────────────────────────
cross_attention:
  hidden_dim: 128
  num_heads: 8
  dropout: 0.1
  # Additive Attention Biases
  biases:
    lambda_iface: 2.0        # Bonus for interface residues
    interface_cutoff: 5.0    # Å
    lambda_mut: 5.0          # Bonus for mutation sites

# ─────────────────────────────────────────────
# 4. Anti-Symmetric Thermodynamic Predictor
# ─────────────────────────────────────────────
predictor:
  hidden_dim: 128
  siamese_mlp:
    layers: [128, 64, 32]
    activation: "gelu"
    dropout: 0.2
  
  outputs:
    - "predicted_ddg"
    - "auxiliary_affinity_direction"

# ─────────────────────────────────────────────
# Training
# ─────────────────────────────────────────────
training:
  learning_rate: 0.05
  max_iterations: 300
  max_leaf_nodes: 31
  l2_regularization: 1.0

logging:
  source_model: "checkpoints/abcan_source_baseline.joblib"
  source_results: "evaluation/results/abcan_source_only.json"
  source_predictions: "evaluation/results/abcan_source_only_predictions.csv"
